apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-app-green
  labels:
    app: color-app
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: color-app
      version: green
  template:
    metadata:
      labels:
        app: color-app
        version: green
    spec:
      containers:
      - name: color-app
        image: hmacielp/color-app:2.0.0
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: color-app
  namespace: dev
spec:
  type: LoadBalancer
  selector:
    app: color-app
    version: green
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080