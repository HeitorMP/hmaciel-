name: CI - Version & Build Docker Hub

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'break/**'

permissions:
  contents: write
  packages: write

jobs:
  version-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # preciso do histórico completo para tags

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # ===============================
      # Definir nível de versionamento
      # ===============================
      - name: Determine bump level
        id: bump
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/feature/* ]]; then
            echo "DEFAULT_BUMP=minor" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/heads/bugfix/* ]]; then
            echo "DEFAULT_BUMP=patch" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/heads/break/* ]]; then
            echo "DEFAULT_BUMP=major" >> $GITHUB_ENV
          else
            echo "DEFAULT_BUMP=patch" >> $GITHUB_ENV
          fi

      # ===============================
      # Gerar nova tag e obter output
      # ===============================
      - name: Create new tag
        id: create_tag
        uses: anothrnick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: "true"
          DEFAULT_BUMP: "${{ env.DEFAULT_BUMP }}"

      - name: Show version tag
        run: |
          echo "Generated tag: ${{ steps.create_tag.outputs.new_tag }}"

      # ===============================
      # Configurar Docker Buildx
      # ===============================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # ===============================
      # Login no Docker Hub
      # ===============================
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}    # Seu usuário Docker Hub
          password: ${{ secrets.DOCKER_PASSWORD }}    # Sua senha/token Docker Hub

      # ===============================
      # Build e push da imagem Docker
      # ===============================
      - name: Build and push Docker image (multiarch)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t yourdockerhubusername/yourapp:${{ steps.create_tag.outputs.new_tag }} \
            --push \
            .
